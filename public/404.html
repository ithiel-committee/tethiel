<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>tethiel</title>
    <script>
      // GitHub Pages SPA redirect: converts deep path into query for index.html
      var pathSegmentsToKeep = 1; // '/tethiel/' has 1 segment
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
