<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>tethiel - iTL防衛戦 逆テトリス型アクションパズル</title>
    <!-- Google Fonts: DotGothic16 & Silkscreen -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 404.html からの SPA リダイレクト復元
      (function (l) {
        if (l.search[1] === "/" || l.search.indexOf("?p=/") !== -1 || l.search.indexOf("&p=/") !== -1) {
          var pMatch = l.search.match(/[?&]p=([^&]+)/);
          if (pMatch) {
            var decoded = decodeURIComponent(pMatch[1]);
            window.history.replaceState(
              null,
              null,
              l.pathname.replace(/\/$/, "") + decoded + l.hash,
            );
          }
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
